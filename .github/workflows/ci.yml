name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Lint, formatting, and packing don't need the native `zeromq` binding
      # (rebuilt for Electron inside the editor), so skip install scripts for a
      # fast, reliable job.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  integration:
    # Run the Jasmine spec suite inside a real Lumine build. The specs use the
    # editor runtime (lumine config/notifications, the watchFile path-watcher), so
    # this is the single place they run in CI.
    name: Lumine integration specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
    steps:
      - uses: actions/checkout@v6
        with:
          path: jupyter-repl
      - uses: actions/checkout@v6
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/checkout@v6
        with:
          repository: lumine-code/language-ipython
          path: language-ipython
      - uses: actions/checkout@v6
        with:
          repository: lumine-code/jupyter-cells
          path: jupyter-cells
      - uses: actions/setup-node@v6
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the real kernel lifecycle test dependency
        run: python -m pip install "ipykernel==7.4.0"
      - name: Install Linux build and headless-display dependencies
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      # The Node lifecycle check uses zeromq's shipped Node-API prebuild;
      # the editor rebuild happens separately below. No install scripts needed.
      - name: Install package dependencies
        working-directory: jupyter-repl
        run: npm ci --ignore-scripts
      # Mirrors the editor's own CI: install without scripts (patch-package and
      # some native install scripts misbehave; native modules are rebuilt for
      # Electron below), then reproduce the pieces that matter. npm records the
      # @lumine-code git forks with ssh URLs, but the runner has no ssh key, so
      # rewrite them to anonymous HTTPS (the forks are public). Serialized
      # retries absorb flaky git-hosted fork downloads.
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Apply patches
        working-directory: lumine
        run: npx patch-package
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Exercise real kernel starts, restarts and request cleanup
        working-directory: jupyter-repl
        timeout-minutes: 3
        env:
          LUMINE_RESOURCE_PATH: ${{ github.workspace }}/lumine
          LUMINE_TEST_TEMP_DIR: ${{ runner.temp }}
        run: npm run test:kernel-lifecycle
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: |
          mkdir -p "$HOME/.lumine/packages-dev"
          ln -s "$GITHUB_WORKSPACE/language-ipython" "$HOME/.lumine/packages-dev/language-ipython"
          ln -s "$GITHUB_WORKSPACE/jupyter-cells" "$HOME/.lumine/packages-dev/jupyter-cells"
          xvfb-run --auto-servernum npm start -- --test ../jupyter-repl/spec
