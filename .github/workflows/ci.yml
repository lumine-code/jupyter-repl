name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # The native smoke check uses zeromq's shipped Node-API prebuild, so no
      # native install scripts or Electron rebuild are needed in this job.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check package contents
        run: npm pack --dry-run
      - name: Check native ZeroMQ startup and socket cleanup
        run: npm run test:zeromq

  kernel-lifecycle:
    name: Real kernel lifecycle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        run: npm ci --ignore-scripts
      - name: Install the real kernel lifecycle test dependency
        run: python -m pip install "ipykernel==7.4.0"
      - name: Exercise real kernel starts, restarts and request cleanup
        timeout-minutes: 3
        env:
          LUMINE_TEST_TEMP_DIR: ${{ runner.temp }}
        run: npm run test:kernel-lifecycle

  integration:
    # Run the Jasmine spec suite inside a real Lumine build. The specs use the
    # editor runtime (lumine config/notifications, the watchFile path-watcher), so
    # full runtime suites run on all three supported operating systems.
    name: Lumine integration specs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      LUMINE_JASMINE_REPORTER: list
      TEMP: ${{ github.workspace }}/jupyter-repl-spec-tmp
      TMP: ${{ github.workspace }}/jupyter-repl-spec-tmp
      TMPDIR: ${{ github.workspace }}/jupyter-repl-spec-tmp
    steps:
      - uses: actions/checkout@v7
        with:
          path: jupyter-repl
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - name: Check out the original runtime for the full regression control
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          path: jupyter-repl-original
          ref: 48d61e99288a14df12f345d1c04525f68c8d3879
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Create the private temporary directory
        run: mkdir -p "$TEMP"
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      # Mirrors the editor's own CI: install without scripts (patch-package and
      # some native install scripts misbehave; native modules are rebuilt for
      # Electron below), then reproduce the pieces that matter. npm records the
      # @lumine-code git forks with ssh URLs, but the runner has no ssh key, so
      # rewrite them to anonymous HTTPS (the forks are public). Serialized
      # retries absorb flaky git-hosted fork downloads.
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: jupyter-repl
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Apply patches
        working-directory: lumine
        run: npx patch-package
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Install ecosystem integration peers in an isolated home
        working-directory: lumine
        run: node script/install-spec-packages.js --package ../jupyter-repl --home "$RUNNER_TEMP/jupyter-spec-home" --github-env "$GITHUB_ENV"
      - name: Verify the identical regressions against the original full runtime
        if: runner.os == 'Linux'
        working-directory: lumine
        timeout-minutes: 20
        run: |
          ln -s "$GITHUB_WORKSPACE/jupyter-repl/node_modules" "$GITHUB_WORKSPACE/jupyter-repl-original/node_modules"
          cp ../jupyter-repl/spec/unicode-completion-offsets-spec.js ../jupyter-repl-original/spec/
          cp ../jupyter-repl/spec/text-index-spec.js ../jupyter-repl-original/spec/
          peer_home="$LUMINE_HOME"
          export LUMINE_HOME="$RUNNER_TEMP/jupyter-original-home"
          mkdir -p "$LUMINE_HOME"
          ln -s "$peer_home/packages" "$LUMINE_HOME/packages"
          export HOME="$LUMINE_HOME" USERPROFILE="$LUMINE_HOME"
          set +e
          xvfb-run --auto-servernum npm start -- --test ../jupyter-repl-original/spec > "$RUNNER_TEMP/jupyter-original.log" 2>&1
          original_status=$?
          set -e
          cat "$RUNNER_TEMP/jupyter-original.log"
          test "$original_status" -eq 1
          grep -E '[0-9]+ specs, 6 failures' "$RUNNER_TEMP/jupyter-original.log"
          if grep '\[FAIL\]' "$RUNNER_TEMP/jupyter-original.log" | grep -Ev '^(Jupyter completion code-point offsets|converting between character and code-unit indices) '; then
            echo "Unexpected original-runtime regression"
            exit 1
          fi
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: |
          export HOME="$LUMINE_HOME" USERPROFILE="$LUMINE_HOME"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum npm start -- --test ../jupyter-repl/spec
          else
            npm start -- --test ../jupyter-repl/spec
          fi
